[project]
name = "mylibrary"
version = "0.0.1"
description = "This is a demo/test Python project"
readme = "README.md"
license = "MIT"
license-files = [
    "License"
]
authors = [
    {name = "Thomas Graf", email = "tngraf@gmx.de"}
]
keywords = ["python", "test"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "colorama>=0.4.6",
    "requests>=2.28.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-cov = ">=4.1.0"
responses = ">=0.23.0"
sphinx = ">=7.0.0"
flake8 = ">=6.0.0"
black = ">=23.0.0"
isort = ">=5.12.0"
pyflakes = ">=3.0.0"
mypy = ">=2.1.0,<3.0.0"
types-colorama = "^0.4.15.20260508"
codespell = "^2.4.2"

[project.urls]
Repository = "https://github.com/tngraf/Python-GitHub-Example"
Homepage = "https://github.com/tngraf/Python-GitHub-Example"
issues = "https://github.com/tngraf/Python-GitHub-Example/issues"

[tool.mypy]
exclude = [
    "/tests", "/__pycache__", "/docs", "/build", "/dist", "_ignore"
]

[tool.black]
exclude = "docs/"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = "docs/*"

[tool.flake8]
exclude = "docs/,.git,__pycache__"
max-line-length = 100

[tool.codespell]
skip = "./docs,./test,./_ignore,*.svg,./build,./dist,./htmlcov"
